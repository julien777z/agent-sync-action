name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.2.0
      - name: Install dependencies
        run: poetry install --extras dev
      - name: Check formatting
        run: poetry run black --check .
      - name: Check types
        run: poetry run pyright
      - name: Run tests
        run: poetry run pytest
      - name: Compile Python
        run: poetry run python -m compileall -q src tests
      - name: Prepare current-branch action validation
        run: poetry run python -m agent_sync mirror-providers --root .
      - name: Test current-branch action
        uses: ./
        with:
          dry-run: "true"
          refresh-external-resources: "true"
