name: Agent Sync Action
description: Keep your AI coding assistants in sync from a single shared setup.
author: julien777z

branding:
  icon: refresh-cw
  color: purple

inputs:
  github-token:
    description: Token used to commit and push changes (or open a pull request).
    default: ${{ github.token }}
  refresh-external-skills:
    description: Force vendoring external skills from the registry before mirroring.
    default: "false"
  skills-cli-version:
    description: Version of the skills CLI used to update external skills.
    default: "1.5.13"
  mode:
    description: How to persist changes — commit (push to the branch) or pull-request.
    default: commit
  agents-dir:
    description: Source-of-truth directory name; the registry is read from <agents-dir>/external_skills.json.
    default: .agents
  output-dir:
    description: Directory holding generated provider trees, relative to the repository root; empty writes them at the root.
    default: ""
  generate-agents-md:
    description: Generate AGENTS.md and synchronize its Codex document capacity; false leaves AGENTS.md unmanaged.
    default: "true"
  dry-run:
    description: Report changes without writing; provider mirror drift fails while external updates remain informational.
    default: "false"

runs:
  using: composite
  steps:
    - name: Decide external-skill refresh
      id: refresh
      shell: bash
      env:
        REFRESH: ${{ inputs.refresh-external-skills }}
        EVENT_NAME: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        CURRENT_SHA: ${{ github.sha }}
        AGENTS_DIR: ${{ inputs.agents-dir }}
      run: |
        set -uo pipefail
        enabled=false
        if [ "$REFRESH" = "true" ]; then
          enabled=true
        elif [ "$EVENT_NAME" = "push" ]; then
          before="$BEFORE"
          if [ -n "$before" ] && ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$before" 2>/dev/null || true
          fi
          if [ -n "$before" ] && git cat-file -e "${before}^{commit}" 2>/dev/null \
             && git diff --name-only "$before" "$CURRENT_SHA" \
                  | grep -qx "$AGENTS_DIR/external_skills.json"; then
            enabled=true
          fi
        fi
        echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

    - name: Read Node version
      if: ${{ steps.refresh.outputs.enabled == 'true' || inputs.mode == 'commit' }}
      id: node
      shell: bash
      run: |
        # setup-node cannot read a composite action's version file directly.
        node_version="$(tr -d '[:space:]' < "$GITHUB_ACTION_PATH/.nvmrc")"
        echo "version=$node_version" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ${{ github.action_path }}/.python-version

    - name: Set up Node
      if: ${{ steps.refresh.outputs.enabled == 'true' || inputs.mode == 'commit' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.node.outputs.version }}

    - name: Install dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"

    - name: Vendor external skills
      if: ${{ steps.refresh.outputs.enabled == 'true' }}
      shell: bash
      env:
        AGENT_SYNC_SKILLS_CLI_VERSION: ${{ inputs.skills-cli-version }}
        AGENTS_DIR: ${{ inputs.agents-dir }}
      run: python -m agent_sync vendor-skills --root . --agents-dir "$AGENTS_DIR" ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}

    - name: Run agent sync
      shell: bash
      env:
        AGENTS_DIR: ${{ inputs.agents-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        AGENT_SYNC_GENERATE_AGENTS_MD: ${{ inputs.generate-agents-md }}
      run: python -m agent_sync mirror-providers --root . --agents-dir "$AGENTS_DIR" --output-dir "$OUTPUT_DIR" ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}

    - name: Persist changes
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        AGENT_SYNC_SKILLS_CLI_VERSION: ${{ inputs.skills-cli-version }}
        GH_TOKEN: ${{ inputs.github-token }}
        MODE: ${{ inputs.mode }}
        AGENTS_DIR: ${{ inputs.agents-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        AGENT_SYNC_GENERATE_AGENTS_MD: ${{ inputs.generate-agents-md }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        stage_generated_paths() {
          paths=(.claude .cursor .codex "$AGENTS_DIR")
          if [ -n "$OUTPUT_DIR" ]; then
            paths+=("$OUTPUT_DIR/.claude" "$OUTPUT_DIR/.cursor" "$OUTPUT_DIR/.codex")
          fi
          if [ "$AGENT_SYNC_GENERATE_AGENTS_MD" = "true" ]; then
            paths+=(AGENTS.md)
          fi
          for path in "${paths[@]}"; do
            if [ -z "$path" ]; then continue; fi
            # A path git still tracks is staged even once a run has deleted it.
            if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
              git add -A -- "$path"
            fi
          done
        }

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Drive git (not just gh) with the provided token so pushes use it; the
        # checkout's stored header would otherwise override the remote URL creds.
        git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
        git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        stage_generated_paths

        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi

        if [ "$MODE" = "pull-request" ]; then
          branch="agent-sync/$REF_NAME"
          git commit -m "chore: run agent sync"
          git push --force origin "HEAD:$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base "$REF_NAME" --head "$branch" \
              --title "chore: agent sync" \
              --body "Automated Agent Sync update (provider mirroring and skill vendoring)."
          fi
        else
          git commit -m "chore: run agent sync"
          pre_rebase_head="$(git rev-parse HEAD)"
          git pull --rebase origin "$REF_NAME"

          if ! git diff --quiet "$pre_rebase_head" HEAD -- "$AGENTS_DIR/external_skills.json"; then
            python -m agent_sync vendor-skills --root . --agents-dir "$AGENTS_DIR"
          fi
          python -m agent_sync mirror-providers --root . --agents-dir "$AGENTS_DIR" --output-dir "$OUTPUT_DIR"

          stage_generated_paths

          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          git push origin "HEAD:$REF_NAME"
        fi

    - name: Verify sync idempotence
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        AGENTS_DIR: ${{ inputs.agents-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        AGENT_SYNC_GENERATE_AGENTS_MD: ${{ inputs.generate-agents-md }}
      run: python -m agent_sync mirror-providers --root . --agents-dir "$AGENTS_DIR" --output-dir "$OUTPUT_DIR" --dry-run
