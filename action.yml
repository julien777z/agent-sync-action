name: Agent Sync Action
description: Keep your AI coding assistants in sync from a single shared setup.
author: julien777z

branding:
  icon: refresh-cw
  color: purple

inputs:
  github-token:
    description: Token used to commit and push changes (or open a pull request).
    default: ${{ github.token }}
  refresh-external-resources:
    description: Force vendoring external skills and resources from the registry before mirroring.
    default: "false"
  skills-cli-version:
    description: Version of the skills CLI used to update external skills.
    default: "1.5.13"
  mode:
    description: How to persist changes — commit (push to the branch) or pull-request.
    default: commit
  agents-dir:
    description: Source-of-truth directory name; the external registry is read from this directory.
    default: .agents
  output-dir:
    description: Directory holding generated provider trees, relative to the repository root; empty writes them at the root.
    default: ""
  dry-run:
    description: Report changes without writing; provider mirror drift fails while external updates remain informational.
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ${{ github.action_path }}/.python-version

    - name: Decide external-resource refresh
      id: refresh
      shell: bash
      env:
        REFRESH: ${{ inputs.refresh-external-resources }}
        EVENT_NAME: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        CURRENT_SHA: ${{ github.sha }}
        AGENTS_DIR: ${{ inputs.agents-dir }}
      run: >-
        python "$GITHUB_ACTION_PATH/.github/scripts/refresh_external_resources.py"
        --force "$REFRESH" --event "$EVENT_NAME" --before "$BEFORE"
        --current "$CURRENT_SHA" --agents-dir "$AGENTS_DIR"

    - name: Read Node version
      if: ${{ steps.refresh.outputs.enabled == 'true' || inputs.mode == 'commit' }}
      id: node
      shell: bash
      run: |
        # setup-node cannot read a composite action's version file directly.
        node_version="$(tr -d '[:space:]' < "$GITHUB_ACTION_PATH/.nvmrc")"
        echo "version=$node_version" >> "$GITHUB_OUTPUT"

    - name: Set up Node
      if: ${{ steps.refresh.outputs.enabled == 'true' || inputs.mode == 'commit' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.node.outputs.version }}

    - name: Install dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"

    - name: Vendor external resources
      if: ${{ steps.refresh.outputs.enabled == 'true' }}
      shell: bash
      env:
        AGENT_SYNC_SKILLS_CLI_VERSION: ${{ inputs.skills-cli-version }}
        AGENTS_DIR: ${{ inputs.agents-dir }}
      run: python -m agent_sync vendor-resources --root . --agents-dir "$AGENTS_DIR" ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}

    - name: Run agent sync
      shell: bash
      env:
        AGENTS_DIR: ${{ inputs.agents-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: python -m agent_sync mirror-providers --root . --agents-dir "$AGENTS_DIR" --output-dir "$OUTPUT_DIR" ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}

    - name: Persist changes
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        AGENT_SYNC_SKILLS_CLI_VERSION: ${{ inputs.skills-cli-version }}
        GH_TOKEN: ${{ inputs.github-token }}
        MODE: ${{ inputs.mode }}
        AGENTS_DIR: ${{ inputs.agents-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        REF_NAME: ${{ github.ref_name }}
      run: >-
        python "$GITHUB_ACTION_PATH/.github/scripts/persist_changes.py"
        --action-path "$GITHUB_ACTION_PATH" --agents-dir "$AGENTS_DIR"
        --output-dir "$OUTPUT_DIR" --mode "$MODE" --ref "$REF_NAME"

    - name: Verify sync idempotence
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        AGENTS_DIR: ${{ inputs.agents-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: python -m agent_sync mirror-providers --root . --agents-dir "$AGENTS_DIR" --output-dir "$OUTPUT_DIR" --dry-run
